<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 14; }
      .label { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .sub { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; fill: #6b7280; }
      .tag { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1000" height="420" fill="#fafafa" rx="16"/>

  <!-- External sites -->
  <rect x="40" y="30" width="180" height="70" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="130" y="60" text-anchor="middle" class="label">🌐 Site de recette</text>
  <text x="130" y="80" text-anchor="middle" class="sub">n'importe quelle URL</text>

  <!-- Frontend -->
  <rect x="40" y="170" width="220" height="100" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="200" text-anchor="middle" class="label">⚛️ Frontend PWA</text>
  <text x="150" y="220" text-anchor="middle" class="sub">React 19 + Vite</text>
  <text x="150" y="238" text-anchor="middle" class="sub">React Query · Workbox</text>
  <text x="150" y="256" text-anchor="middle" class="sub">déployé sur Vercel</text>

  <!-- Backend -->
  <rect x="390" y="170" width="230" height="100" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="505" y="200" text-anchor="middle" class="label">🟢 API Backend</text>
  <text x="505" y="220" text-anchor="middle" class="sub">Node.js + Express 5</text>
  <text x="505" y="238" text-anchor="middle" class="sub">Axios + Cheerio (scraping)</text>
  <text x="505" y="256" text-anchor="middle" class="sub">serverless sur Vercel</text>

  <!-- Supabase -->
  <rect x="760" y="170" width="200" height="100" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="860" y="200" text-anchor="middle" class="label">🗄️ Supabase</text>
  <text x="860" y="220" text-anchor="middle" class="sub">PostgreSQL</text>
  <text x="860" y="238" text-anchor="middle" class="sub">RPC recherche ingrédient</text>
  <text x="860" y="256" text-anchor="middle" class="sub">Row Level Security</text>

  <!-- Parsing engine detail -->
  <rect x="390" y="320" width="230" height="70" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="505" y="348" text-anchor="middle" class="label">🧠 Moteur de parsing</text>
  <text x="505" y="366" text-anchor="middle" class="sub">JSON-LD → heuristiques CSS</text>

  <!-- Arrows -->
  <path class="arrow" d="M130,100 L150,168"/>
  <path class="arrow" d="M260,215 L388,215"/>
  <path class="arrow" d="M620,215 L758,215"/>
  <path class="arrow" d="M505,270 L505,318"/>
</svg>
